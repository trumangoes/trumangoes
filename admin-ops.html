<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRU Mangoes — Ops Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#15100a; --bg2:#1d1610; --bg3:#271e14; --raise:#2f2417;
  --line:#3a2d1d; --line2:#4a3a24;
  --gold:#e8a92e; --gold-deep:#c8780a; --cream:#f7ecd8;
  --text:#f3e9d6; --dim:#bca988; --faint:#8a785c;
  --green:#7bbf6a; --amber:#e8a92e; --red:#e0654f; --blue:#6aa9c9;
  --fdisp:'Fraunces',Georgia,serif; --fsans:'Hanken Grotesk',system-ui,sans-serif; --fmono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--fsans);color:var(--text);background:
  radial-gradient(1200px 600px at 80% -10%, rgba(232,169,46,.07), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, rgba(200,120,10,.06), transparent 55%),
  var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased;}
button{font-family:var(--fsans);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--fsans)}
.mono{font-family:var(--fmono)}
.disp{font-family:var(--fdisp)}
a{color:var(--gold)}

/* boot */
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:200}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.brand-mark{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;background:radial-gradient(circle at 35% 30%,#ffcf5e,var(--gold-deep));box-shadow:0 8px 24px -6px rgba(232,169,46,.5),inset 0 2px 4px rgba(255,255,255,.4)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font-weight:600;font-size:14px;padding:11px 16px;transition:.15s;border:1px solid transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#241701;box-shadow:0 8px 20px -8px rgba(232,169,46,.6)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--bg3);border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--line2);background:var(--raise)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}
.inp{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;transition:.15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,169,46,.13)}
.inp::placeholder{color:var(--faint)}
.field{margin-top:14px}
.field label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;font-weight:600}

.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--dim);font-weight:500;font-size:14px;transition:.13s;margin-bottom:2px;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.on{background:linear-gradient(90deg,rgba(232,169,46,.16),rgba(232,169,46,.04));color:var(--cream)}
.nav-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.nav-badge{margin-left:auto;background:var(--gold-deep);color:#1a0f02;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(21,16,10,.72);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,191,106,.6)}70%{box-shadow:0 0 0 7px rgba(123,191,106,0)}100%{box-shadow:0 0 0 0 rgba(123,191,106,0)}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg3);color:var(--dim)}
.chip select{background:none;border:none;color:var(--text);outline:none;font-weight:600;font-size:12px;font-family:var(--fsans)}
.iconbtn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--line);color:var(--dim);flex:none}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}

.page{padding:24px;max-width:1320px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.page-title{font-family:var(--fdisp);font-size:26px;font-weight:600;letter-spacing:-.01em;color:var(--cream)}
.page-sub{color:var(--faint);font-size:13px;margin-top:2px}

.card{background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .val{font-family:var(--fdisp);font-size:26px;font-weight:600;margin-top:7px;color:var(--cream);line-height:1}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:6px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sec-title{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dim);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;border:1px solid}
.dotb{width:6px;height:6px;border-radius:50%;display:inline-block}

.tbl-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl thead th{text-align:left;padding:11px 14px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--bg3);border-bottom:1px solid var(--line)}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl tbody tr{transition:.1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--bg3)}
.tbl tbody tr:last-child td{border-bottom:none}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:230px}
.search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13.5px}
.sel{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--text);font-size:13px;outline:none;font-family:var(--fsans)}
.sel:focus{border-color:var(--gold)}

.scrim{position:fixed;inset:0;background:rgba(8,5,2,.62);backdrop-filter:blur(3px);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;background:linear-gradient(180deg,var(--bg2),var(--bg));border-left:1px solid var(--line);z-index:51;display:flex;flex-direction:column;animation:slide .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:translateX(0);opacity:1}}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:480px;max-width:94vw;max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--line2);border-radius:18px;z-index:51;animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between}
.drawer-body{padding:20px;overflow:auto;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.row .k{color:var(--faint);font-size:12.5px}
.row .v{font-weight:600;font-size:13.5px;text-align:right}
.empty{text-align:center;padding:44px;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold);color:var(--cream);padding:11px 18px;border-radius:11px;z-index:80;font-size:13.5px;font-weight:500;box-shadow:0 16px 40px -12px rgba(0,0,0,.7);animation:pop .2s}
.progress{height:6px;border-radius:5px;background:var(--bg3);overflow:hidden;margin-top:10px}
.progress>div{height:100%;border-radius:5px}
.chartbox{position:relative;height:230px}
.chartbox.sm{height:200px}
svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.sidebar{display:none}}
</style>

</head><body>
<div id="boot"><div class="brand-mark">🥭</div><div class="spin"></div><div style="color:var(--faint);font-size:13px">Loading…</div></div>
<div id="app" style="display:none"></div><div id="overlay"></div><div id="toast"></div>
<div style="position:fixed;bottom:10px;left:12px;font:12px/1 'IBM Plex Mono',monospace;color:#8a785c;z-index:5">LIVE · connected to your Google Sheet</div>
<script>
/* ===== REAL google.script.run — talks to your Apps Script /exec over HTTPS ===== */
/* Drop-in replacement for the old mock. Same method names + return shapes the    */
/* UI already expects, so none of the UI code below changes. Every write re-reads  */
/* the sheet before resolving, so the screen can never disagree with the sheet.    */
window.VIEWER_EMAIL = "";
(function(){
  // ⬇⬇ Your deployed Web App URL (same one the customer site + admin.html use). ⬇⬇
  var API_URL = 'https://script.google.com/macros/s/AKfycbzcqR6mZZW26kNz9b5sxW6H5bH_JaY0w5OHmPBr3XadjJKkLbn_d61wsTYk9SNVOB1V/exec';

  // Prices mirror Code.gs CONFIG.PRICES (used for the New Order estimate + charts).
  var VARS=[{id:'banganapalli',name:'Banganapalli',color:'#e8a92e',price:47},
            {id:'kesar',name:'Kesar',color:'#f0b84a',price:55},
            {id:'rasalu',name:'Rasalu',color:'#d9962a',price:52},
            {id:'himayat',name:'Himayat',color:'#c8780a',price:55}];

  function creds(){ return { u: localStorage.getItem('tru_admin_user')||'', p: localStorage.getItem('tru_admin_pw')||'' }; }
  function todayStr(){ var d=new Date(); function p(n){return ('0'+n).slice(-2);} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function nowIso(){ return new Date().toISOString(); }

  // Hardened GET: retries 3x and detects Apps Script cold-start HTML (which is not
  // JSON). This is what stops a save from "looking failed" when it actually landed.
  function apiGet(action, params){
    var c=creds();
    var url=API_URL+'?action='+encodeURIComponent(action)+'&user='+encodeURIComponent(c.u)+'&pw='+encodeURIComponent(c.p);
    if(params){ for(var k in params){ if(params[k]!=null) url+='&'+k+'='+encodeURIComponent(params[k]); } }
    var attempt=0;
    function tryOnce(){
      var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function(){ try{ctrl.abort();}catch(e){} }, 12000) : null; // 12s hard cap so it can't hang
      return fetch(url,{redirect:'follow',cache:'no-store',signal:ctrl?ctrl.signal:undefined})
        .then(function(res){ if(timer) clearTimeout(timer); return res.text(); })
        .then(function(t){ t=(t||'').trim();
          if(t.charAt(0)!=='{' && t.charAt(0)!=='[') throw new Error('Connection issue (server returned a non-JSON page)');
          return JSON.parse(t); })
        .catch(function(e){ if(timer) clearTimeout(timer); attempt++; if(attempt<3) return new Promise(function(r){setTimeout(r,700*attempt);}).then(tryOnce); throw e; });
    }
    return tryOnce();
  }

  // Backend order row (getOrdersData_) -> the order shape the UI renders.
  function mapOrder(b){
    var items=[['banganapalli','Banganapalli',+b.bangan||0],['kesar','Kesar',+b.kesar||0],
               ['rasalu','Rasalu',+b.rasalu||0],['himayat','Himayat',+b.himayat||0]]
      .filter(function(x){return x[2]>0;}).map(function(x){return {v:x[0],name:x[1],q:x[2]};});
    var ps=String(b.paymentStatus||'').toLowerCase();
    var cancelled=(ps==='cancelled'||ps==='canceled'||ps==='expired');
    var paid=!!b.paymentReceived;
    var pickedUp=!!b.pickedUp;
    var pickupStatus=pickedUp?'picked_up':(paid?'awaiting':'not_picked');
    var total=+b.totalAmount||0;
    var ref='';
    var o={ id:String(b.orderId), name:b.customerName||'', phone:b.phone||'', whatsapp:b.whatsapp||b.phone||'',
      email:b.email||'', city:b.pickupLocation||b.city||'', items:items, totalBoxes:+b.totalBoxes||0, total:total,
      paid:paid, cancelled:cancelled, paymentStatus:(paid?'paid':(cancelled?'cancelled':'unpaid')),
      paymentMethod:b.paymentMethod||'', zelleRef:ref, paymentDate:'', pickedUp:pickedUp,
      pickupStatus:pickupStatus, pickupLoc:b.pickupLocation||'', notes:b.notes||'', orderDate:b.orderDate||'' };
    o.stamp=(paid?'P':cancelled?'X':'U')+'|'+pickupStatus+'|'+total+'|'+ref;
    return o;
  }
  function locsFrom(orders){ var s={},out=[]; orders.forEach(function(o){ if(o.pickupLoc&&!s[o.pickupLoc]){s[o.pickupLoc]=1;out.push(o.pickupLoc);} }); return out; }
  function findOrder(orders,id){ for(var i=0;i<orders.length;i++) if(orders[i].id===String(id)) return orders[i]; return null; }

  function fetchOrders(){
    return apiGet('orders',{}).then(function(r){
      if(!r || r.status!=='ok') throw new Error((r&&(r.message||r.code))||'Could not load orders');
      var orders=(r.data||[]).map(mapOrder);
      return { orders:orders, locations:locsFrom(orders), varieties:VARS, today:todayStr() };
    });
  }
  // After a write, re-read the sheet so the UI shows authoritative state (no mismatch).
  function writeThenReread(action, params, id){
    return apiGet(action, params).then(function(r){
      if(!r || r.status!=='ok') throw new Error((r&&r.message)||'Save failed — try again');
      return fetchOrders().then(function(d){ return { ok:true, order:findOrder(d.orders,id), savedAt:nowIso() }; });
    });
  }

  // The "server": same names + shapes the UI calls. Each returns a Promise.
  var SRV={
    ping:function(){ return apiGet('verify',{}).then(function(r){ if(!r||r.status!=='ok') throw new Error('auth'); return {ok:true,time:nowIso(),user:r.username||creds().u}; }); },
    getBootstrap:function(){ return fetchOrders().then(function(d){ return { user:creds().u, orders:d.orders, locations:d.locations, varieties:d.varieties, today:d.today,
      zelle:{handle:'972-654-9231', name:'VSVV International', paypal:'', venmo:''}, otp:{required:false,channel:'manual',ttl:10} }; }); },
    getOrders:function(){ return fetchOrders(); },
    getOrder:function(id){ return fetchOrders().then(function(d){ return { order:findOrder(d.orders,id), savedAt:nowIso() }; }); },
    recordPayment:function(id,ref,expect){ var method = ref ? ('Zelle · '+ref) : 'Zelle'; return writeThenReread('markPaymentReceived',{orderId:id,method:method},id); },
    markPickedUp:function(id,expect){ return writeThenReread('markPickedUp',{orderId:id},id); },
    updatePickupStatus:function(id,st,expect){ if(st==='picked_up') return SRV.markPickedUp(id,expect); return writeThenReread('unmarkPickedUp',{orderId:id},id); },
    updateNotes:function(id,n){ return apiGet('saveNote',{orderId:id,note:n||''}).then(function(r){ if(!r||r.status!=='ok') throw new Error((r&&r.message)||'Save failed'); return {ok:true,order:null,savedAt:nowIso()}; }); },
    createOrder:function(p){ var b=p.boxes||{}; return apiGet('createOrderAdmin',{ name:p.name, phone:p.phone||'', email:p.email||'', location:p.pickupLoc||'',
      bangan:b.banganapalli||0, kesar:b.kesar||0, rasalu:b.rasalu||0, himayat:b.himayat||0, total:p.total||0 })
      .then(function(r){ if(!r||r.status!=='ok') throw new Error((r&&r.message)||'Create failed'); return {ok:true, id:String(r.orderId), order:null, savedAt:(r.savedAt||nowIso())}; }); },
    savePrices:function(prices){ return Promise.resolve({ok:true, varieties:VARS}); }, // prices live in Code.gs CONFIG
    exportCsvToDrive:function(name,csv){ try{ var url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); return Promise.resolve({url:url}); }
      catch(e){ return Promise.resolve({url:'data:text/csv;charset=utf-8,'+encodeURIComponent(csv)}); } },
    // OTP disabled — pickups are one tap. Stubs kept so nothing breaks if called.
    generatePickupOtp:function(id){ return Promise.reject(new Error('OTP is turned off')); },
    verifyPickupOtp:function(id,code,expect){ return SRV.markPickedUp(id,expect); }
  };

  // Expose as google.script.run so the UI's existing bridge works unchanged.
  var run={ _s:null,_f:null, withSuccessHandler:function(f){this._s=f;return this;}, withFailureHandler:function(f){this._f=f;return this;} };
  Object.keys(SRV).forEach(function(name){ run[name]=function(){ var s=this._s,f=this._f,args=arguments;
    Promise.resolve().then(function(){ return SRV[name].apply(null,args); }).then(function(r){ s&&s(r); }, function(e){ f&&f(e); }); return this; }; });
  window.google={ script:{ run:run, host:{ close:function(){} } } };

  // ---- Simple login gate (creates its own overlay; calls boot() on success) ----
  window.__truLogin=function(){
    var saved=creds();
    function show(msg, autoTry){
      document.getElementById('boot').style.display='none';
      var el=document.getElementById('app');
      el.style.display='block';
      el.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">'+
        '<div class="card" style="width:340px;max-width:92vw">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="brand-mark">🥭</div>'+
        '<div><div class="disp" style="font-size:18px;color:var(--cream)">TRU Mangoes</div>'+
        '<div style="font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase">Ops Command Center</div></div></div>'+
        '<div class="field"><label>Username</label><input class="inp" id="lgU" autocomplete="username" value="'+(saved.u||'')+'"></div>'+
        '<div class="field"><label>Password</label><input class="inp" id="lgP" type="password" autocomplete="current-password" value="'+(saved.p||'')+'"></div>'+
        '<div id="lgErr" style="color:var(--faint);font-size:12.5px;margin-top:10px;min-height:16px">'+(msg||'')+'</div>'+
        '<button class="btn btn-gold btn-block" style="margin-top:8px" id="lgBtn">Sign In</button></div></div>';
      var go=function(){
        var u=(document.getElementById('lgU').value||'').trim(), p=(document.getElementById('lgP').value||'').trim();
        if(!u||!p){ document.getElementById('lgErr').textContent='Enter username and password'; return; }
        document.getElementById('lgErr').style.color='var(--faint)';
        document.getElementById('lgErr').textContent='Verifying…';
        localStorage.setItem('tru_admin_user',u); localStorage.setItem('tru_admin_pw',p);
        SRV.ping().then(function(){ document.getElementById('app').innerHTML=''; document.getElementById('boot').style.display='flex'; boot(); })
          .catch(function(e){ var le=document.getElementById('lgErr'); if(le){ le.style.color='#e0654f'; le.textContent='❌ '+((e&&e.message)||'Could not connect — check the connection and try again'); } });
      };
      document.getElementById('lgBtn').onclick=go;
      document.getElementById('lgP').addEventListener('keypress',function(e){ if(e.key==='Enter') go(); });
      if(autoTry){ go(); }  // creds already saved → try automatically, but the form is on screen so it never just hangs
    }
    // ALWAYS render the login form first (never a blank spinner). If creds are
    // saved, auto-attempt sign-in in the background with visible feedback.
    show('', !!(saved.u && saved.p));
  };
})();
</script>
<script>
/* ===================== TRU MANGOES — CLIENT APP ===================== */

/* Low-level server call (no health side-effects) */
function runServer(fn,args){
  return new Promise(function(res,rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,args||[]);
  });
}
/* App-level call: any success = session alive; any failure schedules a probe */
function gcall(fn){
  var args=Array.prototype.slice.call(arguments,1);
  return runServer(fn,args).then(function(r){ onCallOk(); return r; },
    function(e){ if(fn!=='ping') scheduleProbe(); throw e; });
}

function setLive(state){

  else { c.style.borderColor='var(--green)'; c.style.color='var(--green)'; c.innerHTML='<span class="live-dot"></span> LIVE'; }

function scheduleProbe(){
  if(PROBE_T||SESSION_DOWN) return;
  PROBE_T=setTimeout(function(){ PROBE_T=null;
    runServer('ping',[]).then(function(){ STATE.sessionFails=0; setLive('live'); },
      function(){ STATE.sessionFails++; setLive('reconnecting'); if(STATE.sessionFails>=2) sessionExpired(); });
  },500);
}

  if(SESSION_DOWN) return; SESSION_DOWN=true; clearInterval(TIMER); setLive('reconnecting'); showSessionBar();
  DOWN_T=setInterval(function(){ runServer('ping',[]).then(function(){ recoverSession(); }).catch(function(){}); },15000);
}

  SESSION_DOWN=false; STATE.sessionFails=0; clearInterval(DOWN_T); hideSessionBar(); setLive('live'); startTimers(); refresh(false); toast('✓ Reconnected — session is live');

  var awaiting=o.filter(function(x){return x.paid&&!x.pickedUp&&!x.cancelled;}).length;
  var pickedUp=o.filter(function(x){return x.pickedUp;}).length;
  var unpaid=o.filter(function(x){return !x.paid&&!x.cancelled;}).length;
  var k=[['Total Orders',active.length,'active (excl. cancelled)',''],

    ['Awaiting Pickup',awaiting,'paid · not collected','var(--gold)'],

    '</div>'+

/* ---------------------- Zelle payment request ---------------------- */
// Zelle has no payment URLs/API, so we generate an order-specific REQUEST the
// customer follows in their own bank's Zelle: our handle + exact amount + Order ID memo.
function zelleMsg(o){
  var z=STATE.zelle||{}, hand=z.handle||'(your Zelle handle — set in Settings)', name=z.name||'TRU Mangoes';
  return 'Hi '+(o.name||'there')+'! Your '+name+' order '+o.id+' is '+money2(o.total)+'.\n'+
    'Please pay by Zelle to: '+hand+'\n'+
    'IMPORTANT: put your Order ID "'+o.id+'" in the Zelle memo/note so we can match your payment.\n'+
    'Thank you! 🥭';
}
function digits_(s){ var d=String(s||'').replace(/\D/g,''); if(d.length===10) d='1'+d; return d; }
function waLink(o){ var d=digits_(o.whatsapp||o.phone); return d?'https://wa.me/'+d+'?text='+encodeURIComponent(zelleMsg(o)):''; }
function smsLink(o){ var d=digits_(o.phone||o.whatsapp); return d?'sms:+'+d+'?&body='+encodeURIComponent(zelleMsg(o)):''; }
function mailLink(o){ if(!o.email) return ''; return 'mailto:'+encodeURIComponent(o.email)+'?subject='+encodeURIComponent((STATE.zelle&&STATE.zelle.name||'TRU Mangoes')+' — Payment for order '+o.id)+'&body='+encodeURIComponent(zelleMsg(o)); }
// Optional one-tap pay links (these rails DO support amount-prefilled URLs, unlike Zelle).
function paypalLink(o){ var h=(STATE.zelle&&STATE.zelle.paypal)||''; return h?'https://www.paypal.com/paypalme/'+encodeURIComponent(h)+'/'+(Number(o.total||0))+'USD':''; }
function venmoLink(o){ var h=((STATE.zelle&&STATE.zelle.venmo)||'').replace(/^@/,''); return h?'https://venmo.com/'+encodeURIComponent(h)+'?txn=pay&amount='+(Number(o.total||0))+'&note='+encodeURIComponent('Order '+o.id):''; }
function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); toast('✓ Copied'); return; } }catch(e){}
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('✓ Copied'); }catch(e){ toast('Copy failed — select and copy manually'); } document.body.removeChild(ta);
}
function copyZelle(id){ var o=byId(id); if(o) copyText(zelleMsg(o)); }
function zelleRequestBlock(o){
  if(o.paid||o.cancelled) return '';
  var z=STATE.zelle||{}, noHandle=!z.handle;
  var wa=waLink(o), sms=smsLink(o), ml=mailLink(o);
  var btn=function(href,label,icon){ return href?'<a class="btn btn-ghost btn-sm" href="'+href+'" target="_blank" rel="noopener" style="text-decoration:none">'+ic(icon,14)+' '+label+'</a>':''; };
  var pp=paypalLink(o), vm=venmoLink(o);
  var alt=(pp||vm)?'<div style="margin-top:9px;font-size:11.5px;color:var(--faint)">One-tap alternatives (amount prefilled):</div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:5px">'+btn(pp,'PayPal','wallet')+btn(vm,'Venmo','wallet')+'</div>':'';
  return '<div class="sec-title" style="margin-top:18px">'+ic('wallet',14)+' Request Payment (Zelle)</div>'+
    (noHandle?'<div style="font-size:12px;color:#e8a92e;margin-bottom:8px">Set your Zelle handle in Settings to fill these in.</div>':'')+
    '<div style="background:rgba(232,169,46,.07);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;white-space:pre-wrap;font-size:12.5px;color:var(--dim);line-height:1.5">'+esc(zelleMsg(o))+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:7px">'+
      '<button class="btn btn-gold btn-sm" onclick="copyZelle(\''+o.id+'\')">'+ic('edit',14)+' Copy message</button>'+
      btn(wa,'WhatsApp','phone')+btn(sms,'Text','phone')+btn(ml,'Email','mail')+
    '</div>'+alt;
}

function localPatch(id,patch){ STATE.orders=STATE.orders.map(function(o){return o.id===id?Object.assign({},o,patch):o;}); }
function fmtTime(iso){ if(!iso) return ''; var t=String(iso).split('T')[1]||''; return t.slice(0,8); }
// Apply the server's read-back (authoritative sheet state) and remember when it saved.
function applyConfirmed(id,r,fallback){
  if(r && r.order){ STATE.orders=STATE.orders.map(function(o){return o.id===id?r.order:o;}); }
  else if(fallback){ localPatch(id,fallback); }
  if(r && r.savedAt) STATE.lastSaved={id:id, at:r.savedAt};
}
function savedToast(id,verb,r){ toast('✓ '+verb+' · '+id+(r&&r.savedAt?' — saved to sheet '+fmtTime(r.savedAt):'')); }
function stampOf(id){ var o=byId(id); return o?o.stamp:''; }
// Server refused because the row changed underneath us — show the latest, don't clobber.
function staleNotice(id,r){
  if(r&&r.order){ STATE.orders=STATE.orders.map(function(o){return o.id===id?r.order:o;}); }
  renderNavBadges(); renderView(); if(STATE.selected) openOrder(id);

}

function recalcNew(){

function submitOrder(){

// Look up the order the customer quotes at pickup, fresh from the sheet, and open it.
function pickupLookup(){
  var el=document.getElementById('pickupId'); var v=((el&&el.value)||'').trim();
  if(!v){ toast('Enter the customer\u2019s order ID'); return; }
  toast('Looking up '+v+'\u2026');
  gcall('getOrder',v).then(function(r){
    if(!r||!r.order){ toast('No order found with ID '+v); return; }
    STATE.orders=STATE.orders.map(function(o){return o.id===r.order.id?r.order:o;});
    if(!byId(v)) STATE.orders.push(r.order);
    openOrder(r.order.id);
  }).catch(function(e){ toast('No order found with ID '+v+(/(not found)/i.test(e.message||'')?'':' ('+(e.message||e)+')')); });
}

function drawReportsCharts(){
  Object.keys(CHARTS).forEach(function(k){ if(CHARTS[k]) CHARTS[k].destroy(); });
  if(!window.Chart) return;
  var all=reportData(), o=all.filter(function(x){return !x.cancelled;});
  var tip={backgroundColor:'#271e14',borderColor:'#4a3a24',borderWidth:1,titleColor:'#f3e9d6',bodyColor:'#bca988'};
  var pieOpts={maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:12,font:{size:11}}},tooltip:tip}};
  // payment breakdown (counts incl. cancelled)
  var pay=[all.filter(function(x){return x.paid;}).length, all.filter(function(x){return !x.paid&&!x.cancelled;}).length, all.filter(function(x){return x.cancelled;}).length];
  var c1=document.getElementById('rpPay');
  if(c1) CHARTS.rpPay=new Chart(c1,{type:'doughnut',data:{labels:['Paid','Unpaid','Cancelled'],datasets:[{data:pay,backgroundColor:['#7bbf6a','#e0654f','#8a785c'],borderWidth:0}]},options:pieOpts});
  // pickup breakdown (active orders)
  var pick=[o.filter(function(x){return x.pickedUp;}).length, o.filter(function(x){return x.paid&&!x.pickedUp;}).length, o.filter(function(x){return !x.paid;}).length];
  var c2=document.getElementById('rpPick');
  if(c2) CHARTS.rpPick=new Chart(c2,{type:'doughnut',data:{labels:['Picked Up','Awaiting (paid)','Not paid yet'],datasets:[{data:pick,backgroundColor:['#7bbf6a','#e8a92e','#6aa9c9'],borderWidth:0}]},options:pieOpts});
  // sales by variety (revenue) — pie
  var vm={}; o.forEach(function(x){x.items.forEach(function(it){vm[it.v]=(vm[it.v]||0)+it.q*(vById(it.v).price||0);});});
  var vs=STATE.varieties.filter(function(v){return (vm[v.id]||0)>0;});
  var c3=document.getElementById('rpVar');
  if(c3) CHARTS.rpVar=new Chart(c3,{type:'doughnut',data:{labels:vs.map(function(v){return v.name;}),datasets:[{data:vs.map(function(v){return vm[v.id];}),backgroundColor:vs.map(function(v){return v.color;}),borderWidth:0}]},options:Object.assign({},pieOpts,{plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:12,font:{size:11}}},tooltip:Object.assign({},tip,{callbacks:{label:function(c){return c.label+': $'+c.raw;}}})}})});
  // revenue by location — pie
  var lm={}; o.forEach(function(x){var L=x.pickupLoc||'—'; lm[L]=(lm[L]||0)+x.total;});
  var lk=Object.keys(lm).sort(function(a,b){return lm[b]-lm[a];});
  var palette=['#e8a92e','#c8780a','#7bbf6a','#6aa9c9','#b58bd0','#d9962a'];
  var c4=document.getElementById('rpLoc');
  if(c4) CHARTS.rpLoc=new Chart(c4,{type:'doughnut',data:{labels:lk,datasets:[{data:lk.map(function(L){return lm[L];}),backgroundColor:lk.map(function(_,i){return palette[i%palette.length];}),borderWidth:0}]},options:Object.assign({},pieOpts,{plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:12,font:{size:11}}},tooltip:Object.assign({},tip,{callbacks:{label:function(c){return c.label+': $'+c.raw;}}})}})});
}

        '<button class="btn btn-gold btn-sm" style="margin-top:14px" onclick="savePrices()">'+ic('check',14)+' Save Prices</button>'+
        '<div style="font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6">Stored in the <b>Prices</b> tab of your sheet — drives the auto-estimated Total $ for new orders. You can also edit them directly in that tab. Existing orders keep their saved totals.</div></div>'+
      '<div class="card"><div class="sec-title">'+ic('shield',15)+' Security</div>'+sec.map(function(r){return '<div class="row"><span class="k">'+r[0]+'</span><span class="v" style="color:var(--green)">'+r[1]+'</span></div>';}).join('')+'</div>'+
      '<div class="card"><div class="sec-title">'+ic('dot',15)+' Live / No-Cache</div>'+nc.map(function(r){return '<div class="row"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>';}).join('')+'</div>'+
      '<div class="card"><div class="sec-title">'+ic('truck',15)+' Workflow Rule</div><div style="font-size:13px;color:var(--dim);line-height:1.7"><b>Pay first, then pickup.</b> The <b>Pay Now</b> button shows while an order is unpaid. Once paid, it switches to <b>Mark as Picked Up</b>. The pickup action is blocked on the server too, so an unpaid order can never be marked collected.</div></div>'+
      '<div class="card"><div class="sec-title">'+ic('wallet',15)+' Zelle Payment Requests</div>'+
        '<div class="row"><span class="k">Receiving handle</span><span class="v mono" style="color:'+(STATE.zelle&&STATE.zelle.handle?'var(--green)':'#e8a92e')+'">'+esc(STATE.zelle&&STATE.zelle.handle?STATE.zelle.handle:'not set')+'</span></div>'+
        '<div class="row"><span class="k">Business name</span><span class="v">'+esc((STATE.zelle&&STATE.zelle.name)||'TRU Mangoes')+'</span></div>'+
        '<div class="row"><span class="k">PayPal.Me</span><span class="v mono">'+esc(STATE.zelle&&STATE.zelle.paypal?STATE.zelle.paypal:'—')+'</span></div>'+
        '<div class="row"><span class="k">Venmo</span><span class="v mono">'+esc(STATE.zelle&&STATE.zelle.venmo?STATE.zelle.venmo:'—')+'</span></div>'+
        '<div style="font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6">Each unpaid order has a <b>Request Payment</b> block (open the order) that builds an order-specific Zelle message — your handle, the exact amount, and the Order ID as the memo — ready to send by WhatsApp, text, or email. Zelle has no payment links/API, so the customer pays from their own bank app. Optionally set a PayPal.Me or Venmo handle for one-tap, amount-prefilled alternatives. Configure <b>ZELLE_HANDLE</b>, <b>BUSINESS_NAME</b>, <b>PAYPAL_HANDLE</b>, <b>VENMO_HANDLE</b> in Code.gs CONFIG, then redeploy.</div></div>'+
      '<div class="card"><div class="sec-title">'+ic('lock',15)+' Pickup OTP Verification</div>'+
        '<div class="row"><span class="k">Status</span><span class="v" style="color:'+(STATE.otp&&STATE.otp.required?'var(--green)':'var(--faint)')+'">'+(STATE.otp&&STATE.otp.required?'Required at pickup':'Off')+'</span></div>'+
        '<div class="row"><span class="k">Channel</span><span class="v">'+esc((STATE.otp&&STATE.otp.channel)||'auto')+'</span></div>'+
        '<div class="row"><span class="k">Code validity</span><span class="v">'+((STATE.otp&&STATE.otp.ttl)||10)+' min</span></div>'+
        '<div style="font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6">When on, marking an order picked up requires a one-time code the customer reads back. SMS needs Twilio credentials (CONFIG.TWILIO); otherwise it falls back to email (free) or manual (staff reads the code). Set <b>REQUIRE_PICKUP_OTP</b>, <b>OTP_CHANNEL</b>, <b>OTP_TTL_MIN</b>, and <b>TWILIO</b> in Code.gs CONFIG, then redeploy.</div></div>'+
      '<div class="card"><div class="sec-title">'+ic('user',15)+' Signed-in Account</div><div class="row"><span class="k">You</span><span class="v mono">'+esc(STATE.user)+'</span></div><div style="font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6">Edit the <b>ALLOWLIST</b> in Code.gs to change who can access, then redeploy.</div></div></div></div>';
}
function savePrices(){
  var obj={}; STATE.varieties.forEach(function(v){ var el=document.getElementById('price_'+v.id); if(el) obj[v.id]=+el.value||0; });
  toast('Saving prices…');
  gcall('savePrices',obj).then(function(r){ if(r.varieties) STATE.varieties=r.varieties; renderView(); toast('Prices updated'); }).catch(function(e){toast('Failed: '+(e.message||e));});
}

window.addEventListener('load', function(){
  try {
    if (typeof window.__truLogin === 'function') { window.__truLogin(); return; }
  } catch (e) {}
  // Fallback: if startup didn't wire up, show a visible message instead of spinning.
  var b = document.getElementById('boot');
  if (b) b.innerHTML = '<div class="brand-mark">🥭</div><div style="color:#e0654f;max-width:360px;text-align:center">Could not start the console. Please hard-refresh the page (Cmd/Ctrl+Shift+R). If it persists, reopen the link.</div>';
});
// When the tab regains focus (e.g., laptop woke from sleep), immediately verify the session.
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && STATE.user){
    if(SESSION_DOWN){ runServer('ping',[]).then(function(){ recoverSession(); }).catch(function(){}); }
    else { refresh(false); }
  }
});
</script>
